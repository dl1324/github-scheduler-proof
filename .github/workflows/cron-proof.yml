name: Cron proof

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Record trigger
        shell: bash
        run: |
          echo "event=${{ github.event_name }}"
          echo "utc=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "london=$(TZ=Europe/London date '+%Y-%m-%dT%H:%M:%S%z')"
          echo "Independent cron proof completed successfully."
